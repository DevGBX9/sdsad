name: Build OoreDoost APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OoreDoost-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Get version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: version
        run: echo "version=v1.0.5-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "OoreDoost ${{ steps.version.outputs.version }}"
          body: |
            ## OoreDoost - Automatic Build

            ### Install
            1. Download `app-debug.apk`
            2. Install on your device
            3. Run ADB command once:
            ```
            adb shell pm grant com.ooredoost.app android.permission.WRITE_SECURE_SETTINGS
            ```

            ### Requirements
            - Android 8.0+ (API 26)
            - Ooredoo Algeria SIM
            - ADB permission (one-time)
          files: |
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
